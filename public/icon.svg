<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20" />
      <stop offset="50%" stop-color="#1E1338" />
      <stop offset="100%" stop-color="#0A0815" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="190" stroke="url(#neon)" stroke-width="6" fill="none" opacity="0.4" />
  <!-- Stylized Play & A Logo -->
  <path d="M 180 140 L 360 256 L 180 372 Z" fill="url(#neon)" filter="url(#glow)" />
  <circle cx="360" cy="160" r="14" fill="#F472B6" />
  <circle cx="150" cy="350" r="10" fill="#38BDF8" opacity="0.8" />
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ANIMEFLIX</text>
</svg>
